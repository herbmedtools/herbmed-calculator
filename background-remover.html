<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بیک گراؤنڈ ریموور</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js" crossorigin="anonymous"></script>
<style>
body{font-family:Tahoma;margin:0;background:#FFF8EE;padding:12px}
.box{background:#fff;border-radius:18px;padding:16px;max-width:600px;margin:auto}
h1{color:#7c3aed;text-align:center}
input[type=file]{display:block;width:100%;padding:14px;background:#faf5ff;border:2px dashed #7c3aed;border-radius:12px;margin:12px 0;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:17px;font-weight:bold;margin-top:10px}
button:disabled{opacity:.5}
img,canvas{width:100%;border-radius:12px;margin-top:10px;background:#eee}
select{width:100%;padding:12px;border-radius:12px;margin-top:10px}
#msg{text-align:center;color:#7c3aed;font-weight:bold;line-height:1.8}
</style>
</head>
<body>
<div class="box">
<h1>بیک گراؤنڈ ریموور</h1>
<p style="text-align:center">نیچے سے تصویر چنیں</p>
<input type="file" id="file" accept="image/*">
<p id="msg">تصویر چنیں</p>
<img id="orig">
<canvas id="out"></canvas>
<label>نیا پس منظر</label>
<select id="bg">
<option value="transparent">شفاف</option>
<option value="white">سفید</option>
<option value="black">کالا</option>
<option value="green">سبز</option>
<option value="#7c3aed">جامنی</option>
</select>
<label>کنارے کتنے صاف ہوں</label>
<input type="range" id="smooth" min="0" max="10" value="3" style="width:100%">
<button id="go" disabled>بیک گراؤنڈ ہٹائیں</button>
<button id="dl" disabled>ڈاؤن لوڈ کریں</button>
</div>
<script>
let myFile=null;
const fileEl=document.getElementById('file');
const msg=document.getElementById('msg');
const orig=document.getElementById('orig');
const canvas=document.getElementById('out');
const ctx=canvas.getContext('2d');
fileEl.addEventListener('change',()=>{
  myFile=fileEl.files[0];
  if(!myFile) return;
  orig.src=URL.createObjectURL(myFile);
  document.getElementById('go').disabled=false;
  msg.textContent="تصویر مل گئی، اب بیک گراؤنڈ ہٹائیں دبائیں";
});
const seg=new SelfieSegmentation({locateFile:(f)=>"https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/"+f});
seg.setOptions({modelSelection:1});
seg.onResults((res)=>{
  const w=res.image.width, h=res.image.height;
  canvas.width=w; canvas.height=h;
  ctx.clearRect(0,0,w,h);
  const bg=document.getElementById('bg').value;
  if(bg!=="transparent"){ ctx.fillStyle=bg; ctx.fillRect(0,0,w,h); }
  ctx.drawImage(res.segmentationMask,0,0,w,h);
  ctx.globalCompositeOperation='source-in';
  ctx.drawImage(res.image,0,0,w,h);
  ctx.globalCompositeOperation='source-over';
  msg.textContent="ہو گیا! اب ڈاؤن لوڈ کریں";
  document.getElementById('dl').disabled=false;
});
document.getElementById('go').addEventListener('click',async()=>{
  if(!myFile) return;
  msg.textContent="کام ہو رہا ہے، تھوڑا انتظار کریں...";
  const img=new Image();
  img.onload=async()=>{ await seg.send({image:img}); };
  img.src=URL.createObjectURL(myFile);
});
document.getElementById('bg').addEventListener('change',()=>{
  if(document.getElementById('dl').disabled==false) document.getElementById('go').click();
});
document.getElementById('dl').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download="removed.png"; a.click();
});
</script>
</body>
</html>
