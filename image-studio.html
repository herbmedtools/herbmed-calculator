<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text, Watermark & Collage Maker</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #eef5f0; color: #111827; padding: 14px; }
    .app { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    h1 { font-size: 1.25rem; margin: 0 0 12px; color: #18764f; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    button, .file-btn, select, input[type="text"], input[type="number"] {
      border: 1px solid #d1d5db; border-radius: 8px; padding: 9px 11px; font-size: 0.88rem;
    }
    button, .file-btn { border: none; cursor: pointer; font-weight: 600; background: #e5e7eb; color: #111827; }
    .file-btn { background: #2563eb; color: #fff; display: inline-block; }
    .primary { background: #18764f; color: #fff; }
    .canvas-wrap {
      width: 100%; min-height: 240px; border: 2px dashed #cbd5e1; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; overflow: auto;
      background: #f9fafb; padding: 8px; margin-bottom: 12px;
    }
    canvas { max-width: 100%; height: auto; border-radius: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
    .box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; }
    .box h3 { margin: 0 0 8px; font-size: 0.95rem; color: #18764f; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
    label { font-size: 0.8rem; display: flex; justify-content: space-between; width: 100%; margin-bottom: 3px; }
    input[type="range"] { width: 100%; }
    input[type="color"] { width: 36px; height: 32px; border: none; background: transparent; padding: 0; cursor: pointer; }
    .swatches { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .swatch {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cbd5e1;
      padding: 0; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Text, Watermark & Collage Maker</h1>

    <div class="top-bar">
      <label class="file-btn">
        Main Image
        <input type="file" id="mainInput" accept="image/*" hidden />
      </label>
      <label class="file-btn" style="background:#0284c7;">
        2nd Collage Image
        <input type="file" id="secondInput" accept="image/*" hidden />
      </label>
      <button id="resetBtn">Reset</button>
      <button id="downloadBtn" class="primary">Download PNG</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <div class="grid">
      <div class="box">
        <h3>Text on Image</h3>
        <div class="row">
          <input type="text" id="overlayText" placeholder="Enter text..." style="width:100%;" />
        </div>
        <div class="row">
          <select id="textFont" style="flex:1;">
            <option value="sans-serif">Font: Sans-Serif (Modern)</option>
            <option value="Georgia, serif">Font: Serif (Classic)</option>
            <option value="'Courier New', monospace">Font: Monospace (Typewriter)</option>
            <option value="Impact, Arial Black, sans-serif">Font: Bold Display</option>
          </select>
          <select id="textPos">
            <option value="bottom">Bottom</option>
            <option value="top">Top</option>
            <option value="center">Center</option>
          </select>
        </div>
        <div class="row" style="margin-bottom:4px;">
          <span style="font-size:0.78rem;">Text Color:</span>
          <input type="color" id="textColor" value="#ffffff" />
        </div>
        <div class="swatches" id="textSwatches">
          <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff;" title="White"></button>
          <button type="button" class="swatch" data-color="#000000" style="background:#000000;" title="Black"></button>
          <button type="button" class="swatch" data-color="#facc15" style="background:#facc15;" title="Yellow"></button>
          <button type="button" class="swatch" data-color="#22c55e" style="background:#22c55e;" title="Green"></button>
          <button type="button" class="swatch" data-color="#ef4444" style="background:#ef4444;" title="Red"></button>
          <button type="button" class="swatch" data-color="#38bdf8" style="background:#38bdf8;" title="Sky Blue"></button>
        </div>
        <label><span>Text Size</span><span id="textSizeVal">36px</span></label>
        <input type="range" id="textSize" min="16" max="100" value="36" />
      </div>

      <div class="box">
        <h3>Watermark</h3>
        <div class="row">
          <input type="text" id="wmText" placeholder="Watermark text (e.g. Herbmed)" style="width:100%;" />
        </div>
        <div class="row">
          <select id="wmFont" style="width:100%;">
            <option value="sans-serif">WM Font: Sans-Serif</option>
            <option value="Georgia, serif">WM Font: Serif</option>
            <option value="'Courier New', monospace">WM Font: Monospace</option>
          </select>
        </div>
        <div class="row" style="margin-bottom:6px;">
          <span style="font-size:0.78rem;">WM Color:</span>
          <input type="color" id="wmColor" value="#ffffff" />
          <label class="file-btn" style="background:#4b5563;">
            WM Logo
            <input type="file" id="wmImgInput" accept="image/*" hidden />
          </label>
          <button id="clearWmBtn">Clear</button>
        </div>
        <label><span>Watermark Opacity</span><span id="wmAlphaVal">40%</span></label>
        <input type="range" id="wmAlpha" min="10" max="100" value="40" />
      </div>

      <div class="box">
        <h3>Collage Layout</h3>
        <div class="row">
          <select id="collageMode" style="width:100%;">
            <option value="single">Single Image</option>
            <option value="side">Side by Side (2 Images)</option>
            <option value="stack">Top & Bottom (2 Images)</option>
          </select>
        </div>
        <p style="margin:0; font-size:0.78rem; color:#4b5563;">
          Upload Main Image and 2nd Collage Image, then choose Side by Side or Top & Bottom.
        </p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let mainImg = null;
    let secondImg = null;
    let wmImg = null;

    const overlayTextEl = document.getElementById("overlayText");
    const textFontEl = document.getElementById("textFont");
    const textColorEl = document.getElementById("textColor");
    const textPosEl = document.getElementById("textPos");
    const textSizeEl = document.getElementById("textSize");
    const wmTextEl = document.getElementById("wmText");
    const wmFontEl = document.getElementById("wmFont");
    const wmColorEl = document.getElementById("wmColor");
    const wmAlphaEl = document.getElementById("wmAlpha");
    const collageModeEl = document.getElementById("collageMode");

    function loadFile(file, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => cb(img);
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function render() {
      document.getElementById("textSizeVal").textContent = textSizeEl.value + "px";
      document.getElementById("wmAlphaVal").textContent = wmAlphaEl.value + "%";

      if (!mainImg && !secondImg) {
        canvas.width = 400;
        canvas.height = 220;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#6b7280";
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Upload an image to start", 200, 115);
        return;
      }

      const mode = collageModeEl.value;
      const a = mainImg || secondImg;
      const b = secondImg || mainImg;

      if (mode === "side" && mainImg && secondImg) {
        const h = Math.max(a.naturalHeight, b.naturalHeight);
        const wA = Math.round((a.naturalWidth / a.naturalHeight) * h);
        const wB = Math.round((b.naturalWidth / b.naturalHeight) * h);
        canvas.width = wA + wB;
        canvas.height = h;
        ctx.drawImage(a, 0, 0, wA, h);
        ctx.drawImage(b, wA, 0, wB, h);
      } else if (mode === "stack" && mainImg && secondImg) {
        const w = Math.max(a.naturalWidth, b.naturalWidth);
        const hA = Math.round((a.naturalHeight / a.naturalWidth) * w);
        const hB = Math.round((b.naturalHeight / b.naturalWidth) * w);
        canvas.width = w;
        canvas.height = hA + hB;
        ctx.drawImage(a, 0, 0, w, hA);
        ctx.drawImage(b, 0, hA, w, hB);
      } else {
        canvas.width = a.naturalWidth;
        canvas.height = a.naturalHeight;
        ctx.drawImage(a, 0, 0, canvas.width, canvas.height);
      }

      // Overlay Text
      const txt = overlayTextEl.value.trim();
      if (txt) {
        const size = Number(textSizeEl.value);
        ctx.save();
        ctx.font = `bold ${size}px ${textFontEl.value}`;
        ctx.fillStyle = textColorEl.value;
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.65)";
        ctx.shadowBlur = 6;
        let y = canvas.height - size;
        if (textPosEl.value === "top") y = size + 16;
        if (textPosEl.value === "center") y = canvas.height / 2 + size / 3;
        ctx.fillText(txt, canvas.width / 2, y);
        ctx.restore();
      }

      // Watermark
      const alpha = Number(wmAlphaEl.value) / 100;
      const wmTxt = wmTextEl.value.trim();
      if (wmTxt) {
        ctx.save();
        ctx.globalAlpha = alpha;
        const wmSize = Math.max(18, Math.round(canvas.width * 0.045));
        ctx.font = `bold ${wmSize}px ${wmFontEl.value}`;
        ctx.fillStyle = wmColorEl.value;
        ctx.textAlign = "right";
        ctx.fillText(wmTxt, canvas.width - 18, canvas.height - 18);
        ctx.restore();
      }

      if (wmImg) {
        ctx.save();
        ctx.globalAlpha = alpha;
        const logoW = Math.round(canvas.width * 0.18);
        const logoH = Math.round((wmImg.naturalHeight / wmImg.naturalWidth) * logoW);
        ctx.drawImage(wmImg, 16, 16, logoW, logoH);
        ctx.restore();
      }
    }

    document.querySelectorAll("#textSwatches .swatch").forEach(btn => {
      btn.addEventListener("click", () => {
        textColorEl.value = btn.dataset.color;
        render();
      });
    });

    document.getElementById("mainInput").addEventListener("change", (e) => {
      if (e.target.files[0]) loadFile(e.target.files[0], (img) => { mainImg = img; render(); });
    });
    document.getElementById("secondInput").addEventListener("change", (e) => {
      if (e.target.files[0]) loadFile(e.target.files[0], (img) => { secondImg = img; render(); });
    });
    document.getElementById("wmImgInput").addEventListener("change", (e) => {
      if (e.target.files[0]) loadFile(e.target.files[0], (img) => { wmImg = img; render(); });
    });
    document.getElementById("clearWmBtn").addEventListener("click", () => {
      wmImg = null;
      wmTextEl.value = "";
      render();
    });

    [overlayTextEl, textFontEl, textColorEl, textPosEl, textSizeEl, wmTextEl, wmFontEl, wmColorEl, wmAlphaEl, collageModeEl].forEach(el => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      mainImg = null; secondImg = null; wmImg = null;
      overlayTextEl.value = ""; wmTextEl.value = "";
      textFontEl.value = "sans-serif"; wmFontEl.value = "sans-serif";
      textColorEl.value = "#ffffff"; wmColorEl.value = "#ffffff";
      collageModeEl.value = "single";
      textSizeEl.value = 36; wmAlphaEl.value = 40;
      render();
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = "herbmed-image-studio.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });

    render();
  </script>
</body>
</html>
