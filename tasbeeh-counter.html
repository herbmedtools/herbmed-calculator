<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ڈیجیٹل تسبیح کاؤنٹر | Digital Tasbeeh Counter</title>
    <meta name="description" content="موبائل فرینڈلی ڈیجیٹل تسبیح کاؤنٹر جس میں ساؤنڈ، وائبریشن، اذکار اور آٹو سیو کی سہولت موجود ہے۔">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --primary-light: #ccfbf1;
            --bg: #f0fdfa;
            --card: #ffffff;
            --text: #134e4a;
            --muted: #64748b;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--primary);
        }

        .controls-top {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn.off {
            background: #f1f5f9;
            color: var(--muted);
            text-decoration: line-through;
        }

        .zikr-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            font-size: 1rem;
            background: #f8fafc;
            color: var(--text);
            font-weight: 600;
            outline: none;
        }

        .display-box {
            background: linear-gradient(135deg, #0f766e, #115e59);
            color: #ffffff;
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
        }

        .arabic-text {
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: bold;
            min-height: 40px;
        }

        .count-number {
            font-size: 4.2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            margin: 8px 0;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .target-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .target-btn {
            flex: 1;
            padding: 8px;
            border: 1.5px solid #cbd5e1;
            background: #fff;
            border-radius: 10px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
        }

        .target-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .tap-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .tap-btn {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #14b8a6, #0f766e);
            border: 8px solid var(--primary-light);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(15, 118, 110, 0.35);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tap-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }

        .tap-btn span {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: normal;
        }

        .bottom-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-minus {
            background: #f1f5f9;
            color: var(--text);
        }

        .btn-reset {
            background: #fee2e2;
            color: var(--danger);
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 16px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📿 ڈیجیٹل تسبیح</h1>
            <div class="controls-top">
                <button id="soundToggle" class="icon-btn" onclick="toggleSound()">🔊 آواز</button>
                <button id="vibeToggle" class="icon-btn" onclick="toggleVibe()">📳 وائبریشن</button>
            </div>
        </header>

        <div class="zikr-selector">
            <select id="zikrSelect" onchange="changeZikr()">
                <option value="سُبْحَانَ اللّٰهِ">سُبْحَانَ اللّٰهِ (SubhanAllah)</option>
                <option value="اَلْحَمْدُ لِلّٰهِ">اَلْحَمْدُ لِلّٰهِ (Alhamdulillah)</option>
                <option value="اَللّٰهُ اَكْبَرُ">اَللّٰهُ اَكْبَرُ (Allahu Akbar)</option>
                <option value="لَا إِلٰهَ إِلَّا اللّٰهُ">لَا إِلٰهَ إِلَّا اللّٰهُ (La ilaha illallah)</option>
                <option value="اَسْتَغْفِرُ اللّٰهَ">اَسْتَغْفِرُ اللّٰهَ (Astaghfirullah)</option>
                <option value="اَللّٰهُمَّ صَلِّ عَلٰی مُحَمَّدٍ">درودِ پاک (Durood Sharif)</option>
                <option value="عام تسبیح">عام تسبیح (General Counter)</option>
            </select>
        </div>

        <div class="display-box">
            <div class="arabic-text" id="zikrDisplay">سُبْحَانَ اللّٰهِ</div>
            <div class="count-number" id="countDisplay">0</div>
            <div class="stats-row">
                <span>ٹارگٹ: <strong id="targetDisplay">33</strong></span>
                <span>مکمل چکر: <strong id="roundsDisplay">0</strong></span>
                <span>کل گنتی: <strong id="totalDisplay">0</strong></span>
            </div>
        </div>

        <div class="target-bar">
            <button class="target-btn active" onclick="setTarget(33, this)">33</button>
            <button class="target-btn" onclick="setTarget(100, this)">100</button>
            <button class="target-btn" onclick="setTarget(0, this)">لامحدود</button>
        </div>

        <div class="tap-area">
            <button class="tap-btn" id="tapBtn" onclick="increment()">
                تسبیح پڑھیں
                <span>(یہاں ٹچ کریں)</span>
            </button>
        </div>

        <div class="bottom-actions">
            <button class="action-btn btn-minus" onclick="decrement()">-1 کم کریں</button>
            <button class="action-btn btn-reset" onclick="resetCurrent()">🔄 ری سیٹ</button>
        </div>
    </div>

    <footer>
        <a href="index.html">← تمام ٹولز پر واپس جائیں</a>
    </footer>

    <script>
        let state = {
            count: 0,
            total: 0,
            rounds: 0,
            target: 33,
            zikr: "سُبْحَانَ اللّٰهِ",
            sound: true,
            vibe: true
        };

        // Audio Context for clean click sound without external files
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playClickSound(isComplete = false) {
            if (!state.sound) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (isComplete) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch (e) {}
        }

        function triggerVibe(pattern) {
            if (state.vibe && navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        function loadState() {
            const saved = localStorage.getItem('herbmed_tasbeeh_v1');
            if (saved) {
                state = { ...state, ...JSON.parse(saved) };
            }
            updateUI();
        }

        function saveState() {
            localStorage.setItem('herbmed_tasbeeh_v1', JSON.stringify(state));
        }

        function updateUI() {
            document.getElementById('countDisplay').innerText = state.count;
            document.getElementById('totalDisplay').innerText = state.total;
            document.getElementById('roundsDisplay').innerText = state.rounds;
            document.getElementById('targetDisplay').innerText = state.target === 0 ? '∞' : state.target;
            document.getElementById('zikrDisplay').innerText = state.zikr;
            document.getElementById('zikrSelect').value = state.zikr;

            const soundBtn = document.getElementById('soundToggle');
            soundBtn.classList.toggle('off', !state.sound);

            const vibeBtn = document.getElementById('vibeToggle');
            vibeBtn.classList.toggle('off', !state.vibe);

            document.querySelectorAll('.target-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((state.target === 33 && btn.innerText === '33') ||
                    (state.target === 100 && btn.innerText === '100') ||
                    (state.target === 0 && btn.innerText === 'لامحدود')) {
                    btn.classList.add('active');
                }
            });
        }

        function increment() {
            state.count++;
            state.total++;

            if (state.target > 0 && state.count >= state.target) {
                state.rounds++;
                playClickSound(true);
                triggerVibe([100, 50, 100]);
                setTimeout(() => {
                    state.count = 0;
                    saveState();
                    updateUI();
                }, 350);
            } else {
                playClickSound(false);
                triggerVibe(35);
            }

            saveState();
            updateUI();
        }

        function decrement() {
            if (state.count > 0) {
                state.count--;
                if (state.total > 0) state.total--;
                triggerVibe(20);
                saveState();
                updateUI();
            }
        }

        function resetCurrent() {
            if (confirm('کیا آپ موجودہ گنتی صفر (0) کرنا چاہتے ہیں؟')) {
                state.count = 0;
                state.rounds = 0;
                triggerVibe(60);
                saveState();
                updateUI();
            }
        }

        function setTarget(val, btn) {
            state.target = val;
            saveState();
            updateUI();
        }

        function changeZikr() {
            state.zikr = document.getElementById('zikrSelect').value;
            saveState();
            updateUI();
        }

        function toggleSound() {
            state.sound = !state.sound;
            if (state.sound) playClickSound(false);
            saveState();
            updateUI();
        }

        function toggleVibe() {
            state.vibe = !state.vibe;
            if (state.vibe) triggerVibe(40);
            saveState();
            updateUI();
        }

        // Initialize on load
        loadState();
    </script>
</body>
</html>
