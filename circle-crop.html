<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تصویر کو گول کاٹیں</title>
<style>
body{font-family:Tahoma;margin:0;background:#FFF8EE;padding:12px}
.box{background:#fff;border-radius:18px;padding:16px;max-width:600px;margin:auto}
h1{color:#0f766e;text-align:center}
input[type=file]{display:block;width:100%;padding:14px;background:#f0fdfa;border:2px dashed #0f766e;border-radius:12px;margin:12px 0;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:17px;font-weight:bold;margin-top:10px}
button:disabled{opacity:.5}
img,canvas{width:100%;border-radius:12px;margin-top:10px;background:#eee}
select,input[type=range]{width:100%;padding:12px;border-radius:12px;margin-top:10px}
#msg{text-align:center;color:#0f766e;font-weight:bold;line-height:1.8}
label{display:block;margin-top:14px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>تصویر کو گول کاٹیں</h1>
<p style="text-align:center">پروفائل فوٹو کے لیے بہترین</p>
<input type="file" id="file" accept="image/*">
<p id="msg">تصویر چنیں</p>
<img id="orig">
<canvas id="out"></canvas>
<label>گول کتنا بڑا ہو</label>
<input type="range" id="size" min="50" max="100" value="95">
<label>پس منظر</label>
<select id="bg">
<option value="transparent">شفاف</option>
<option value="white">سفید</option>
<option value="black">کالا</option>
<option value="green">سبز</option>
<option value="#0f766e">سبز - HerbMed</option>
</select>
<label>بارڈر کا رنگ</label>
<select id="border">
<option value="none">بغیر بارڈر</option>
<option value="white">سفید بارڈر</option>
<option value="black">کالا بارڈر</option>
<option value="#0f766e">سبز بارڈر</option>
</select>
<button id="go" disabled>گول کاٹیں</button>
<button id="dl" disabled>ڈاؤن لوڈ کریں</button>
</div>
<script>
let myFile=null, myImg=null;
const fileEl=document.getElementById('file');
const msg=document.getElementById('msg');
const orig=document.getElementById('orig');
const canvas=document.getElementById('out');
const ctx=canvas.getContext('2d');
fileEl.addEventListener('change',()=>{
  myFile=fileEl.files[0];
  if(!myFile) return;
  const url=URL.createObjectURL(myFile);
  orig.src=url;
  myImg=new Image();
  myImg.onload=()=>{
    document.getElementById('go').disabled=false;
    msg.textContent="تصویر مل گئی، اب گول کاٹیں دبائیں";
  };
  myImg.src=url;
});
function draw(){
  if(!myImg) return;
  const s=600;
  canvas.width=s; canvas.height=s;
  ctx.clearRect(0,0,s,s);
  const bg=document.getElementById('bg').value;
  if(bg!=="transparent"){ ctx.fillStyle=bg; ctx.fillRect(0,0,s,s); }
  const size=Number(document.getElementById('size').value)/100;
  const r=(s/2)*size;
  ctx.save();
  ctx.beginPath();
  ctx.arc(s/2,s/2,r,0,Math.PI*2);
  ctx.closePath();
  ctx.clip();
  const side=Math.min(myImg.width,myImg.height);
  const sx=(myImg.width-side)/2;
  const sy=(myImg.height-side)/2;
  ctx.drawImage(myImg,sx,sy,side,side,0,0,s,s);
  ctx.restore();
  const border=document.getElementById('border').value;
  if(border!=="none"){
    ctx.beginPath();
    ctx.arc(s/2,s/2,r,0,Math.PI*2);
    ctx.lineWidth=12;
    ctx.strokeStyle=border;
    ctx.stroke();
  }
  msg.textContent="ہو گیا! اب ڈاؤن لوڈ کریں";
  document.getElementById('dl').disabled=false;
}
document.getElementById('go').addEventListener('click',draw);
document.getElementById('size').addEventListener('change',()=>{ if(myImg && document.getElementById('dl').disabled==false) draw(); });
document.getElementById('bg').addEventListener('change',()=>{ if(myImg && document.getElementById('dl').disabled==false) draw(); });
document.getElementById('border').addEventListener('change',()=>{ if(myImg && document.getElementById('dl').disabled==false) draw(); });
document.getElementById('dl').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png');
  a.download="circle-photo.png"; a.click();
});
</script>
</body>
</html>
