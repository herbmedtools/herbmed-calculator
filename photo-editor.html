<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Editor & Background Remover</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; padding: 14px; }
    .app { max-width: 740px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    h1 { font-size: 1.2rem; margin: 0 0 12px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    button, .file-btn, select {
      border: none; border-radius: 8px; padding: 9px 12px; font-size: 0.88rem;
      cursor: pointer; background: #e5e7eb; color: #111827; font-weight: 600;
    }
    .file-btn { background: #2563eb; color: #fff; display: inline-block; }
    .primary { background: #059669; color: #fff; }
    .ai-btn { background: #7c3aed; color: #fff; }
    button:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
    .canvas-wrap {
      width: 100%; min-height: 240px; border: 2px dashed #cbd5e1; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; overflow: auto;
      background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
                        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
                        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      padding: 8px;
    }
    canvas { max-width: 100%; height: auto; border-radius: 6px; }
    .bg-bar {
      margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: #f9fafb; padding: 10px; border-radius: 10px; border: 1px solid #e5e7eb;
    }
    .bg-bar span { font-size: 0.85rem; font-weight: 600; }
    input[type="color"] { width: 38px; height: 34px; border: none; background: transparent; cursor: pointer; padding: 0; }
    .panel { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .control { background: #f9fafb; padding: 8px 10px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .control label { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 4px; }
    input[type="range"] { width: 100%; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .status { margin-top: 10px; font-size: 0.85rem; color: #4b5563; min-height: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Image Editor & Background Remover</h1>

    <div class="top-bar">
      <label class="file-btn">
        Upload Image
        <input type="file" id="fileInput" accept="image/*" hidden />
      </label>
      <button id="removeBgBtn" class="ai-btn" disabled>Remove Background</button>
      <button id="resetBtn" disabled>Reset</button>
      <button id="downloadBtn" class="primary" disabled>Download PNG</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <div class="bg-bar">
      <span>Background:</span>
      <input type="color" id="bgColor" value="#ffffff" disabled title="Pick Color" />
      <button id="solidBgBtn" disabled>Apply Color</button>
      <button id="transparentBgBtn" disabled>Transparent</button>
      <button id="whiteBgBtn" disabled>White</button>
      <button id="blackBgBtn" disabled>Black</button>
      <label class="file-btn" style="background:#374151;">
        BG Image
        <input type="file" id="bgInput" accept="image/*" hidden />
      </label>
    </div>

    <div class="actions">
      <select id="cropRatio" disabled>
        <option value="full">Crop: Full (Original)</option>
        <option value="1:1">Crop: 1:1 Square</option>
        <option value="4:3">Crop: 4:3</option>
        <option value="16:9">Crop: 16:9</option>
      </select>
      <button id="flipHBtn" disabled>Flip Horizontal</button>
      <button id="flipVBtn" disabled>Flip Vertical</button>
      <button id="rotateBtn" disabled>Rotate 90°</button>
      <button id="grayscaleBtn" disabled>Grayscale</button>
      <button id="invertBtn" disabled>Invert</button>
      <button id="sepiaBtn" disabled>Sepia</button>
    </div>

    <div class="panel">
      <div class="control">
        <label><span>Brightness</span><span id="brightVal">100%</span></label>
        <input type="range" id="brightness" min="0" max="200" value="100" disabled />
      </div>
      <div class="control">
        <label><span>Contrast</span><span id="contrastVal">100%</span></label>
        <input type="range" id="contrast" min="0" max="200" value="100" disabled />
      </div>
      <div class="control">
        <label><span>Blur</span><span id="blurVal">0px</span></label>
        <input type="range" id="blur" min="0" max="20" value="0" disabled />
      </div>
      <div class="control">
        <label><span>Opacity</span><span id="opacityVal">100%</span></label>
        <input type="range" id="opacity" min="10" max="100" value="100" disabled />
      </div>
    </div>

    <div class="status" id="status">Select an image to begin.</div>
  </div>

  <script type="module">
    import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const bgColorInput = document.getElementById("bgColor");
    const cropRatioSelect = document.getElementById("cropRatio");

    let sourceImg = null;
    let bgImg = null;
    let bgColor = null; // null means transparent unless set
    let flipH = 1, flipV = 1, rotation = 0;
    let grayscale = false, invert = false, sepia = false;

    const sliders = {
      brightness: document.getElementById("brightness"),
      contrast: document.getElementById("contrast"),
      blur: document.getElementById("blur"),
      opacity: document.getElementById("opacity"),
    };

    const buttons = [
      "removeBgBtn", "resetBtn", "downloadBtn",
      "solidBgBtn", "transparentBgBtn", "whiteBgBtn", "blackBgBtn",
      "flipHBtn", "flipVBtn", "rotateBtn",
      "grayscaleBtn", "invertBtn", "sepiaBtn"
    ].map(id => document.getElementById(id));

    function setControlsEnabled(enabled) {
      buttons.forEach(b => b.disabled = !enabled);
      bgColorInput.disabled = !enabled;
      cropRatioSelect.disabled = !enabled;
      Object.values(sliders).forEach(s => s.disabled = !enabled);
    }

    function updateLabels() {
      document.getElementById("brightVal").textContent = sliders.brightness.value + "%";
      document.getElementById("contrastVal").textContent = sliders.contrast.value + "%";
      document.getElementById("blurVal").textContent = sliders.blur.value + "px";
      document.getElementById("opacityVal").textContent = sliders.opacity.value + "%";
    }

    function getTargetAspectRatio() {
      const val = cropRatioSelect.value;
      if (val === "1:1") return 1;
      if (val === "4:3") return 4 / 3;
      if (val === "16:9") return 16 / 9;
      return null;
    }

    function render() {
      if (!sourceImg) return;
      updateLabels();

      const swap = (rotation % 180) !== 0;
      const baseW = swap ? sourceImg.naturalHeight : sourceImg.naturalWidth;
      const baseH = swap ? sourceImg.naturalWidth : sourceImg.naturalHeight;

      let outW = baseW;
      let outH = baseH;
      const targetRatio = getTargetAspectRatio();

      if (targetRatio) {
        const currentRatio = baseW / baseH;
        if (currentRatio > targetRatio) {
          outW = Math.round(baseH * targetRatio);
          outH = baseH;
        } else {
          outW = baseW;
          outH = Math.round(baseW / targetRatio);
        }
      }

      canvas.width = outW;
      canvas.height = outH;
      ctx.clearRect(0, 0, outW, outH);

      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, outW, outH);
      }

      if (bgImg) {
        ctx.drawImage(bgImg, 0, 0, outW, outH);
      }

      ctx.save();
      ctx.globalAlpha = sliders.opacity.value / 100;

      const filters = [
        `brightness(${sliders.brightness.value}%)`,
        `contrast(${sliders.contrast.value}%)`,
        `blur(${sliders.blur.value}px)`,
        grayscale ? "grayscale(100%)" : "",
        invert ? "invert(100%)" : "",
        sepia ? "sepia(100%)" : ""
      ].filter(Boolean).join(" ");

      ctx.filter = filters || "none";
      ctx.translate(outW / 2, outH / 2);
      ctx.rotate((rotation * Math.PI) / 180);
      ctx.scale(flipH, flipV);

      // Fit or center-crop cleanly inside outW x outH
      const imgW = sourceImg.naturalWidth;
      const imgH = sourceImg.naturalHeight;
      const drawW = swap ? imgH : imgW;
      const drawH = swap ? imgW : imgH;
      const scale = targetRatio ? Math.max(outW / drawW, outH / drawH) : Math.min(outW / drawW, outH / drawH);

      ctx.drawImage(
        sourceImg,
        (-imgW * scale) / 2,
        (-imgH * scale) / 2,
        imgW * scale,
        imgH * scale
      );
      ctx.restore();
    }

    function loadImageFromFile(file, onLoad) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => onLoad(img);
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function resetAllState() {
      bgImg = null;
      bgColor = null;
      cropRatioSelect.value = "full";
      flipH = 1; flipV = 1; rotation = 0;
      grayscale = false; invert = false; sepia = false;
      sliders.brightness.value = 100;
      sliders.contrast.value = 100;
      sliders.blur.value = 0;
      sliders.opacity.value = 100;
    }

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadImageFromFile(file, (img) => {
        sourceImg = img;
        resetAllState();
        setControlsEnabled(true);
        statusEl.textContent = "Image loaded. Ready to edit.";
        render();
      });
    });

    document.getElementById("bgInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || !sourceImg) return;
      loadImageFromFile(file, (img) => {
        bgImg = img;
        bgColor = null;
        render();
      });
    });

    document.getElementById("solidBgBtn").addEventListener("click", () => {
      bgColor = bgColorInput.value;
      bgImg = null;
      render();
    });

    document.getElementById("transparentBgBtn").addEventListener("click", () => {
      bgColor = null;
      bgImg = null;
      render();
    });

    document.getElementById("whiteBgBtn").addEventListener("click", () => {
      bgColor = "#ffffff";
      bgImg = null;
      render();
    });

    document.getElementById("blackBgBtn").addEventListener("click", () => {
      bgColor = "#000000";
      bgImg = null;
      render();
    });

    document.getElementById("removeBgBtn").addEventListener("click", async () => {
      if (!sourceImg) return;
      try {
        statusEl.textContent = "Removing background (first run may download AI model)...";
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = sourceImg.naturalWidth;
        tempCanvas.height = sourceImg.naturalHeight;
        tempCanvas.getContext("2d").drawImage(sourceImg, 0, 0);

        const blob = await new Promise(res => tempCanvas.toBlob(res, "image/png"));
        const resultBlob = await removeBackground(blob);
        const url = URL.createObjectURL(resultBlob);

        const cleanImg = new Image();
        cleanImg.onload = () => {
          sourceImg = cleanImg;
          URL.revokeObjectURL(url);
          statusEl.textContent = "Background removed!";
          render();
        };
        cleanImg.src = url;
      } catch (err) {
        statusEl.textContent = "Background removal failed: " + err.message;
      }
    });

    cropRatioSelect.addEventListener("change", render);
    document.getElementById("flipHBtn").addEventListener("click", () => { flipH *= -1; render(); });
    document.getElementById("flipVBtn").addEventListener("click", () => { flipV *= -1; render(); });
    document.getElementById("rotateBtn").addEventListener("click", () => { rotation = (rotation + 90) % 360; render(); });
    document.getElementById("grayscaleBtn").addEventListener("click", () => { grayscale = !grayscale; render(); });
    document.getElementById("invertBtn").addEventListener("click", () => { invert = !invert; render(); });
    document.getElementById("sepiaBtn").addEventListener("click", () => { sepia = !sepia; render(); });

    Object.values(sliders).forEach(s => s.addEventListener("input", render));

    document.getElementById("resetBtn").addEventListener("click", () => {
      resetAllState();
      render();
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "edited-image.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  </script>
</body>
</html>
