<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>واٹس ایپ ڈائریکٹ میسج ٹول | WhatsApp Direct Message</title>
    <meta name="description" content="نمبر محفوظ کیے بغیر براہِ راست واٹس ایپ میسج بھیجیں یا واٹس ایپ چیٹ لنک بنائیں۔">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --primary-light: #ccfbf1;
            --wa: #16a34a;
            --wa-dark: #15803d;
            --bg: #f0fdfa;
            --card: #ffffff;
            --text: #134e4a;
            --muted: #64748b;
            --border: #cbd5e1;
            --soft: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
        }

        header h1 {
            font-size: 1.15rem;
            color: var(--primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text);
        }

        .phone-row {
            display: flex;
            gap: 8px;
        }

        select, input[type="tel"], textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: 0.98rem;
            background: var(--soft);
            color: var(--text);
            outline: none;
        }

        .code-select {
            width: 135px;
            flex-shrink: 0;
            font-weight: 700;
        }

        input[type="tel"] {
            direction: ltr;
            text-align: left;
            font-weight: 600;
        }

        textarea {
            min-height: 95px;
            resize: vertical;
            line-height: 1.5;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 13px 10px;
            border: none;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .btn-wa {
            grid-column: span 2;
            background: var(--wa);
            color: #ffffff;
            font-size: 1.02rem;
        }

        .btn-copy {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-clear {
            background: #f1f5f9;
            color: var(--text);
        }

        .link-preview-box {
            background: var(--soft);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .link-label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--muted);
        }

        .link-text {
            font-size: 0.85rem;
            color: var(--primary-dark);
            word-break: break-all;
            direction: ltr;
            text-align: left;
            min-height: 22px;
        }

        .status-msg {
            text-align: center;
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--primary-dark);
            min-height: 20px;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 16px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>💬 واٹس ایپ ڈائریکٹ میسج</h1>
        </header>

        <div class="form-group">
            <label for="phoneInput">واٹس ایپ نمبر (بغیر نمبر سیو کیے):</label>
            <div class="phone-row">
                <select id="countryCode" class="code-select" onchange="updateLinkPreview()">
                    <option value="92" selected>🇵🇰 +92</option>
                    <option value="91">🇮🇳 +91</option>
                    <option value="966">🇸🇦 +966</option>
                    <option value="971">🇦🇪 +971</option>
                    <option value="44">🇬🇧 +44</option>
                    <option value="1">🇺🇸 +1</option>
                </select>
                <input type="tel" id="phoneInput" placeholder="03001234567" oninput="updateLinkPreview()">
            </div>
        </div>

        <div class="form-group">
            <label for="messageInput">پیغام (اختیاری):</label>
            <textarea id="messageInput" placeholder="یہاں اپنا پیغام لکھیں..." oninput="updateLinkPreview()"></textarea>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-wa" onclick="openWhatsApp()">📲 واٹس ایپ پر میسج کھولیں</button>
            <button type="button" class="btn btn-copy" onclick="copyWaLink()">🔗 لنک کاپی کریں</button>
            <button type="button" class="btn btn-clear" onclick="clearForm()">↺ صاف کریں</button>
        </div>

        <div class="link-preview-box">
            <div class="link-label">تیار شدہ واٹس ایپ لنک:</div>
            <div class="link-text" id="linkPreview">نمبر درج کریں...</div>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <footer>
        <a href="index.html">← تمام ٹولز پر واپس جائیں</a>
    </footer>

    <script>
        function cleanPhone(code, rawPhone) {
            let digits = (rawPhone || '').replace(/\D/g, '');
            if (!digits) return '';
            if (digits.startsWith('00')) {
                digits = digits.slice(2);
            }
            if (digits.startsWith(code)) {
                return digits;
            }
            if (digits.startsWith('0')) {
                digits = digits.slice(1);
            }
            return code + digits;
        }

        function buildWaUrl() {
            const code = document.getElementById('countryCode').value;
            const rawPhone = document.getElementById('phoneInput').value;
            const msg = document.getElementById('messageInput').value.trim();
            const fullPhone = cleanPhone(code, rawPhone);

            if (!fullPhone || fullPhone.length < 8) return '';

            let url = `https://wa.me/${fullPhone}`;
            if (msg) {
                url += `?text=${encodeURIComponent(msg)}`;
            }
            return url;
        }

        function saveDraft(code, phone, msg) {
            try {
                localStorage.setItem('herbmed_wa_direct_v1', JSON.stringify({ code, phone, msg }));
            } catch (e) {}
        }

        function loadDraft() {
            try {
                const raw = localStorage.getItem('herbmed_wa_direct_v1');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.code) document.getElementById('countryCode').value = parsed.code;
                    if (parsed.phone) document.getElementById('phoneInput').value = parsed.phone;
                    if (parsed.msg) document.getElementById('messageInput').value = parsed.msg;
                }
            } catch (e) {}
        }

        function updateLinkPreview() {
            const code = document.getElementById('countryCode').value;
            const phone = document.getElementById('phoneInput').value;
            const msg = document.getElementById('messageInput').value;
            saveDraft(code, phone, msg);

            const url = buildWaUrl();
            const preview = document.getElementById('linkPreview');
            document.getElementById('statusMsg').innerText = '';

            if (!url) {
                preview.innerText = 'درست موبائل نمبر درج کریں...';
            } else {
                preview.innerText = url;
            }
        }

        function openWhatsApp() {
            const url = buildWaUrl();
            if (!url) {
                document.getElementById('statusMsg').innerText = 'براہ کرم درست واٹس ایپ نمبر درج کریں۔';
                return;
            }
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function copyWaLink() {
            const url = buildWaUrl();
            if (!url) {
                document.getElementById('statusMsg').innerText = 'پہلے درست نمبر درج کر کے لنک بنائیں۔';
                return;
            }
            const doneMsg = 'واٹس ایپ لنک کاپی ہو گیا ہے';
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => {
                        document.getElementById('statusMsg').innerText = doneMsg;
                    }).catch(() => fallbackCopy(url, doneMsg));
                } else {
                    fallbackCopy(url, doneMsg);
                }
            } catch (e) {
                fallbackCopy(url, doneMsg);
            }
        }

        function fallbackCopy(text, doneMsg) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                document.getElementById('statusMsg').innerText = doneMsg;
            } catch (e) {
                document.getElementById('statusMsg').innerText = 'کاپی ممکن نہیں ہو سکا';
            }
        }

        function clearForm() {
            document.getElementById('phoneInput').value = '';
            document.getElementById('messageInput').value = '';
            updateLinkPreview();
        }

        loadDraft();
        updateLinkPreview();
    </script>
</body>
</html>
